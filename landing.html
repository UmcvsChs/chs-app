<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1E1B16"/>
<title>CHS — Complete Housing Solutions</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:#1E1B16;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;
  background:linear-gradient(180deg,#4A6883 0%,#161310 42%,#1E1B16 52%,#8A5220 72%,#C4762C 100%)}
.emblem{width:110px;height:110px;border-radius:24px;background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;margin-bottom:26px;backdrop-filter:blur(2px)}
.chs-mark{display:flex;align-items:center;font-family:'Playfair Display',Georgia,serif;font-size:40px;font-weight:700;color:#fff;line-height:1}
.h-house{position:relative;display:inline-block;width:0.62em;height:0.78em;margin:0 0.04em}
.h-house .post{position:absolute;bottom:0;width:0.1em;height:0.62em;background:#fff}
.h-house .post.left{left:0.08em}
.h-house .post.right{right:0.08em}
.h-house .roof{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:0.34em solid transparent;border-right:0.34em solid transparent;border-bottom:0.3em solid #fff}
.name{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;color:#fff;letter-spacing:0.5px;margin-bottom:6px}
.full{font-size:11px;color:rgba(255,255,255,0.75);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.tag{font-size:13px;color:rgba(255,255,255,0.6);font-style:italic;margin-bottom:40px}
.line{width:52px;height:2px;background:linear-gradient(90deg,#4A6883,#C4762C);margin-bottom:28px}
.dots{display:flex;gap:7px;margin-bottom:36px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.25);animation:pulse 1.4s ease infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1);background:#C4762C}}
.enter-btn{padding:14px 40px;background:#E8622F;color:#fff;border:none;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 6px 24px rgba(232,98,47,0.35);letter-spacing:0.3px}
.footer{position:absolute;bottom:24px;font-size:10px;color:rgba(255,255,255,0.4)}
</style>
</head>
<body>
<div id="wrap">
  <div class="emblem">
    <div class="chs-mark">
      <span>C</span>
      <span class="h-house"><span class="post left"></span><span class="post right"></span><span class="roof"></span></span>
      <span>S</span>
    </div>
  </div>
  <div class="name">Complete Housing Solutions</div>
  <div class="full">CHS · Property Platform</div>
  <div class="tag">Your property, our commitment</div>
  <div class="line"></div>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <button class="enter-btn" onclick="location.href='index.html'">Enter CHS</button>
  <div class="footer">Operated by Stadt-Thélima</div>
</div>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
setTimeout(function(){ window.location.href = 'index.html'; }, 2800);
</script>
</body>
</html>
